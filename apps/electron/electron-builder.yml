# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.kila.app
productName: Kila
copyright: Copyright © 2024-2025 Kila

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 39.5.1

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# ASAR 打包配置
# 启用 ASAR 提升分发安全性和文件读取性能
# 保留仍由 app.asar 引用的运行时依赖的解包规则。
# Pi SDK 已作为 ext-modules 放入 Resources，由 external-esm-loader 按 ESM export 加载，
# 不应再复制到 app.asar / app.asar.unpacked。
asar: true

# Electron Fuses — 在二进制层面关闭不需要的运行时能力（详见 scripts/apply-fuses.cjs）
# electron-builder 25.x 尚无 electronFuses 配置项，改用 afterPack 钩子调用 @electron/fuses
afterPack: scripts/apply-fuses.cjs

# macOS 签名后处理：未签名构建（无 Apple Developer ID 证书时）ad-hoc 签名 + hardened runtime
# 会导致 EXC_BAD_ACCESS / Invalid Page 启动崩溃，这里在签名后检测并重签清除 hardened runtime。
# 已具备正式 Team ID 签名时自动跳过，不影响正式签名 + 公证流程。
afterSign: scripts/repack-adhoc-mac.cjs

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  - package.json
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@kila/**"
  # 排除 sourcemap（仅用于本地崩溃分析，不分发）
  - "!dist/**/*.map"
  # 排除 ext-modules 产物（已通过 extraResources 复制到 Resources/ext-modules/）
  - "!dist/ext-modules/**"
  # Pi 运行时通过 Resources/ext-modules 加载，避免 app.asar 内重复一份。
  - "!node_modules/@earendil-works/**"
  # 排除飞书 SDK（已通过 extraResources 复制，避免 ASAR 内重复打包）
  - "!node_modules/@larksuiteoapi/**"

# 通用额外资源
extraResources:
  # 内置 Skills 源目录（启动时同步到 ~/.kila/global-agent/.agents/skills/）
  - from: builtin-skills
    to: builtin-skills
    filter:
      - "**/*"
  # CLI 入口产物（首次启动时按平台写入 kila wrapper）
  - from: ../../apps/cli/dist
    to: cli
    filter:
      - "**/*"
  # External 依赖（esbuild external 的运行时包，含递归子依赖）
  # 走 extraResources 而非 ASAR，避免 node_modules 依赖解析断裂
  - from: dist/ext-modules
    to: ext-modules
    filter:
      - "**/*"
# 文件类型关联（双击打开）
fileAssociations:
  - ext: kila-session
    name: Kila Session
    mimeType: application/x-kila-session
    role: Editor
  - ext: kila-skill
    name: Kila Skill
    mimeType: application/x-kila-skill
    role: Viewer

# ============================================
# macOS 配置
# ============================================
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
  # macOS 额外资源
  extraResources:
    # Bun 二进制（download-bun.ts 使用 darwin-${arch} 命名）
    - from: "vendor/bun/darwin-${arch}"
      to: "vendor/bun"
      filter:
        - "**/*"

# DMG 配置
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ============================================
# Windows 配置
# ============================================
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Windows 额外资源
  extraResources:
    # Bun 二进制
    - from: "vendor/bun/win32-${arch}"
      to: "vendor/bun"
      filter:
        - "**/*"
    # bash 二进制（busybox-w32 的 w64u Unicode 构建，UTF-8 处理中文路径），
    # 提供 Windows 开箱即用的 shell 环境；版本与 SHA256 锁定在 scripts/download-bash.ts
    - from: "vendor/bash/win32-${arch}"
      to: "vendor/bash"
      filter:
        - "**/*"

# NSIS 安装程序配置
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ============================================
# Linux 配置
# ============================================
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# ============================================
# 发布配置
# ============================================
publish:
  provider: github
  owner: LHXHL
  repo: Kila-Dev
