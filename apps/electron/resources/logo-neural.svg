<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-c" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#162e2e"/>
      <stop offset="1" stop-color="#1f4a4a"/>
    </linearGradient>
    <linearGradient id="line-c" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6abfbf"/>
      <stop offset="1" stop-color="#a8e0e0"/>
    </linearGradient>
    <linearGradient id="node-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8e8e8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5aadad" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5aadad" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5aadad" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg-c)"/>

  <!-- 神经网络式 K：线条 + 节点，暗示 AI 智能 -->
  <g stroke="url(#line-c)" stroke-width="44" stroke-linecap="round" fill="none">
    <!-- 竖线 -->
    <line x1="172" y1="124" x2="172" y2="388"/>
    <!-- 上斜臂 -->
    <line x1="172" y1="256" x2="368" y2="124"/>
    <!-- 下斜臂 -->
    <line x1="172" y1="256" x2="368" y2="388"/>
  </g>

  <!-- 节点光晕 -->
  <g fill="url(#node-glow)">
    <circle cx="172" cy="124" r="28"/>
    <circle cx="172" cy="256" r="28"/>
    <circle cx="172" cy="388" r="28"/>
    <circle cx="368" cy="124" r="28"/>
    <circle cx="368" cy="388" r="28"/>
  </g>

  <!-- 节点圆点 -->
  <g fill="url(#node-c)">
    <circle cx="172" cy="124" r="14"/>
    <circle cx="172" cy="256" r="14"/>
    <circle cx="172" cy="388" r="14"/>
    <circle cx="368" cy="124" r="14"/>
    <circle cx="368" cy="388" r="14"/>
  </g>
</svg>
