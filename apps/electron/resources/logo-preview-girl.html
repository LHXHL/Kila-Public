<!DOCTYPE html>

<head>

<title>Kila Logo — 女孩形象设计</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0d0d0d;
    color: #ccc;
    padding: 48px;
  }
  h1 { text-align: center; font-size: 26px; color: #fff; margin-bottom: 8px; }
  .sub { text-align: center; font-size: 14px; color: #777; margin-bottom: 48px; }

  .showcase {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }

  .cell {
    text-align: center;
  }
  .cell-label {
    font-size: 12px;
    color: #666;
    margin-top: 8px;
  }

  /* 白底 */
  .bg-white {
    background: #fff;
    border-radius: 20px;
    padding: 8px;
    display: inline-block;
  }
  .bg-white svg { border-radius: 14px; display: block; }

  /* 深底 */
  .bg-dark {
    background: #1a1a1a;
    border-radius: 20px;
    padding: 8px;
    display: inline-block;
  }
  .bg-dark svg { border-radius: 14px; display: block; }

  /* 透明底 */
  .bg-checker {
    background-image:
      linear-gradient(45deg, #222 25%, transparent 25%),
      linear-gradient(-45deg, #222 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #222 75%),
      linear-gradient(-45deg, transparent 75%, #222 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    border-radius: 20px;
    padding: 8px;
    display: inline-block;
  }

  .section-title {
    font-size: 16px;
    color: #999;
    margin-bottom: 16px;
    text-align: center;
  }
</style>
</head>
